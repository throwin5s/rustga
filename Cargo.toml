[package]
name = "rustga"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "A lightweight manga, manhwa and manhua reader with native Rust extensions"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip", "brotli", "deflate"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# The macOS reader keeps a titled window and hides the title bar around the real
# traffic lights. These are already in the tree through winit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWindow",
    "NSButton",
    "NSControl",
    "NSView",
    "NSResponder",
] }
raw-window-handle = "0.6"
tao = "0.37.2"
wry = "0.57.2"
